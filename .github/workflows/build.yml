name: Build macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check format
        run: cargo +stable fmt --check
      - name: Check Rust and native code
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: Build and verify app
        run: ./scripts/build-app.sh
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Upload app download
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Screenshot-Shelf-macos-arm64
          path: dist/Screenshot-Shelf-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90
